name: Import publication media

on:
  push:
    branches:
      - agent/own-publication-media
    paths:
      - .github/workflows/import-publication-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@v4
        with:
          ref: agent/own-publication-media

      - name: Download verified Englishire publication assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/media
          base="https://raw.githubusercontent.com/desukara/Englishire/main"
          curl --fail --location --retry 3 "$base/englishire-logo.png" -o assets/media/englishire-logo.png
          curl --fail --location --retry 3 "$base/favicon.ico" -o favicon.ico
          curl --fail --location --retry 3 "$base/favicon-32x32.png" -o favicon-32x32.png
          curl --fail --location --retry 3 "$base/favicon-16x16.png" -o favicon-16x16.png
          curl --fail --location --retry 3 "$base/apple-touch-icon.png" -o apple-touch-icon.png
          curl --fail --location --retry 3 "$base/hiring-foreign-teachers-in-japan.png" -o assets/media/hiring-foreign-teachers-in-japan.png
          curl --fail --location --retry 3 "$base/real-cost-of-english-teacher-turnover.png" -o assets/media/real-cost-of-english-teacher-turnover.png
          curl --fail --location --retry 3 "$base/how-schools-can-handle-staff-shortages.png" -o assets/media/how-schools-can-handle-staff-shortages.png
          curl --fail --location --retry 3 "$base/emergency-classroom-coverage.png" -o assets/media/emergency-classroom-coverage.png
          curl --fail --location --retry 3 "$base/backup-teacher-eikaiwa.png" -o assets/media/backup-teacher-eikaiwa.png
          curl --fail --location --retry 3 "$base/eikaiwa-school-operations.png" -o assets/media/eikaiwa-school-operations.png
          curl --fail --location --retry 3 "$base/school-collapse-after-three-decades-article.png" -o assets/media/school-collapse-after-three-decades-article.png
          test -s assets/media/englishire-logo.png
          test -s favicon.ico
          test -s assets/media/school-collapse-after-three-decades-article.png

      - name: Commit imported binary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media favicon.ico favicon-32x32.png favicon-16x16.png apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "Publication media already imported."
            exit 0
          fi
          git commit -m "Import Eastokyo publication media"
          git push origin HEAD:agent/own-publication-media
