name: Finish publication media transfer

on:
  push:
    branches:
      - agent/own-publication-media
    paths:
      - .github/workflows/import-publication-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/own-publication-media

      - name: Download all publication media
        run: |
          set -e
          mkdir -p assets/media
          base="https://raw.githubusercontent.com/desukara/Englishire/main"
          for file in englishire-logo.png hiring-foreign-teachers-in-japan.png real-cost-of-english-teacher-turnover.png how-schools-can-handle-staff-shortages.png emergency-classroom-coverage.png backup-teacher-eikaiwa.png eikaiwa-school-operations.png school-collapse-after-three-decades-article.png easy-teacher-article.png; do
            curl -fL --retry 3 "$base/$file" -o "assets/media/$file"
            test -s "assets/media/$file"
          done
          for file in favicon.ico favicon-32x32.png favicon-16x16.png apple-touch-icon.png; do
            curl -fL --retry 3 "$base/$file" -o "$file"
            test -s "$file"
          done

      - name: Rewrite Eastokyo media references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "https://englishire.com/englishire-logo.png": "assets/media/englishire-logo.png",
              "https://englishire.com/favicon.ico": "favicon.ico",
              "https://englishire.com/favicon-32x32.png": "favicon-32x32.png",
              "https://englishire.com/favicon-16x16.png": "favicon-16x16.png",
              "https://englishire.com/apple-touch-icon.png": "apple-touch-icon.png",
          }
          for name in (
              "hiring-foreign-teachers-in-japan.png",
              "real-cost-of-english-teacher-turnover.png",
              "how-schools-can-handle-staff-shortages.png",
              "emergency-classroom-coverage.png",
              "backup-teacher-eikaiwa.png",
              "eikaiwa-school-operations.png",
              "school-collapse-after-three-decades-article.png",
              "easy-teacher-article.png",
          ):
              replacements[f"https://englishire.com/{name}"] = f"https://eastokyo.com/assets/media/{name}"

          changed = []
          for path in Path(".").rglob("*.html"):
              original = path.read_text(encoding="utf-8")
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          remaining = []
          for path in Path(".").rglob("*.html"):
              for line_number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if "https://englishire.com/" in line and any(ext in line for ext in (".png", ".ico", ".jpg", ".jpeg", ".webp")):
                      remaining.append(f"{path}:{line_number}")
          if remaining:
              raise SystemExit("Unmigrated media references: " + ", ".join(remaining))
          print("Updated", len(changed), "HTML files")
          PY

      - name: Commit self-contained publication media
        run: |
          rm .github/workflows/import-publication-media.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Eastokyo publication media self-contained"
          git push origin HEAD:agent/own-publication-media
